name: Pipeline checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y potrace libcairo2
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.lock
      - run: ./check.sh
      - run: .venv/bin/python tests/mutation_check.py
